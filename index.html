<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personagens dos Simpsons</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <h1>Os Simpsons</h1>
    <p>Personagens carregados em tempo real de uma API pública</p>
  </header>

  <main>
    <section class="controles">
      <label for="busca">Buscar personagem</label>
      <input type="search" id="busca" placeholder="Ex.: Lisa, Milhouse, Krusty">
      <p id="contador" aria-live="polite"></p>
    </section>

    <section id="lista-personagens" class="grid"></section>

    <p id="mensagem" role="status"></p>
    <button id="btn-carregar-mais" type="button" hidden>Carregar mais</button>
  </main>

  <footer class="rodape">
    <p>Dados: apisimpsons.fly.dev · Trabalho de Web Development Front-End, UniFECAF</p>
  </footer>

  <script src="js/script.js" defer></script>
</body>
</html>
